<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar">

    <div id="sidebar-header">
      <button id="menu-toggle" class="icon-btn" title="Menú" aria-label="Menú">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <form id="search-form" autocomplete="off">
        <input type="text" id="search-input" placeholder="Buscar en el mapa" />
        <button type="button" id="search-clear" class="icon-btn small" aria-label="Limpiar" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5z"/></svg>
        </button>
      </form>
    </div>

    <!-- Tabs de modo -->
    <div id="mode-tabs">
      <button class="tab active" data-mode="search">Buscar</button>
      <button class="tab" data-mode="directions">Rutas</button>
      <button class="tab" data-mode="measure">Medir</button>
    </div>

    <div id="sidebar-body">

      <!-- ---- Panel: Buscar / historial / categorías ---- -->
      <div class="panel" id="panel-search">
        <div class="chip-row" id="category-chips">
          <button class="chip" data-cat="restaurant">🍽️ Restaurantes</button>
          <button class="chip" data-cat="fuel">⛽ Gasolineras</button>
          <button class="chip" data-cat="pharmacy">💊 Farmacias</button>
          <button class="chip" data-cat="cafe">☕ Cafés</button>
          <button class="chip" data-cat="supermarket">🛒 Supermercados</button>
          <button class="chip" data-cat="atm">🏧 Cajeros</button>
        </div>

        <div id="history-section">
          <div class="section-label">Búsquedas recientes</div>
          <ul id="history-list"></ul>
        </div>

        <ul id="results-list"></ul>
      </div>

      <!-- ---- Panel: detalle de lugar con fotos ---- -->
      <div class="panel" id="panel-place" hidden>
        <button class="back-btn" id="place-back">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Volver
        </button>

        <div id="place-photos"></div>

        <div id="place-info">
          <h2 id="place-title"></h2>
          <p id="place-subtitle"></p>

          <div class="place-actions">
            <button id="place-directions-btn" class="action-btn primary">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21.71 11.29l-9-9a1 1 0 00-1.42 0l-9 9a1 1 0 000 1.42l9 9a1 1 0 001.42 0l9-9a1 1 0 000-1.42zM14 14.5V12h-4v3H8v-4a1 1 0 011-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>
              Cómo llegar
            </button>
            <button id="place-share-btn" class="action-btn">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 10-3-3c0 .24.04.47.09.7L7.04 9.81A3 3 0 104 12c0 .24.04.47.09.7L11.13 16.85c-.05.21-.08.43-.08.65a3 3 0 103-1.42z"/></svg>
              Compartir
            </button>
          </div>

          <div id="place-meta"></div>
        </div>
      </div>

      <!-- ---- Panel: Rutas ---- -->
      <div class="panel" id="panel-directions" hidden>
        <div id="directions-inputs">
          <div class="input-row">
            <span class="dot origin-dot"></span>
            <input type="text" id="origin-input" placeholder="Elige un origen" autocomplete="off" />
          </div>
          <div class="input-row">
            <span class="dot dest-dot"></span>
            <input type="text" id="dest-input" placeholder="Elige un destino" autocomplete="off" />
          </div>
          <button id="swap-btn" class="icon-btn small" title="Intercambiar" aria-label="Intercambiar">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 10l5-5 5 5H7zm10 4l-5 5-5-5h10z"/></svg>
          </button>
        </div>

        <div id="profile-row">
          <button class="profile-btn active" data-profile="driving">🚗 Coche</button>
          <button class="profile-btn" data-profile="cycling">🚲 Bici</button>
          <button class="profile-btn" data-profile="foot">🚶 A pie</button>
        </div>

        <ul id="directions-suggestions" class="suggestion-list" hidden></ul>

        <div id="route-summary" hidden></div>
        <ol id="route-steps"></ol>
      </div>

      <!-- ---- Panel: Medir distancia ---- -->
      <div class="panel" id="panel-measure" hidden>
        <p class="hint">Haz clic en el mapa para añadir puntos y medir la distancia entre ellos.</p>
        <div id="measure-total"></div>
        <ol id="measure-points"></ol>
        <button id="measure-clear" class="action-btn">Borrar medición</button>
      </div>

    </div>
  </aside>

  <!-- ===== MAPA ===== -->
  <div id="map-wrap">
    <div id="map"></div>

    <button id="locate-btn" class="icon-btn floating" title="Mi ubicación" aria-label="Mi ubicación">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2a1 1 0 011 1v1.06A8.004 8.004 0 0119.94 11H21a1 1 0 010 2h-1.06A8.004 8.004 0 0113 19.94V21a1 1 0 01-2 0v-1.06A8.004 8.004 0 014.06 13H3a1 1 0 010-2h1.06A8.004 8.004 0 0111 4.06V3a1 1 0 011-1zm0 4a6 6 0 100 12 6 6 0 000-12zm0 3a3 3 0 110 6 3 3 0 010-6z"/></svg>
    </button>

    <div id="toast" hidden></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
